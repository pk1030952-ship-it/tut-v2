name: Build and Publish Debug APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish CoachMaster APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure .env and .env.example exist for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ ! -f "app/.env.example" ]; then
            cp .env.example app/.env.example
          fi
          if [ ! -f "app/.env" ]; then
            cp .env.example app/.env
          fi

      - name: Ensure Firebase google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating app/google-services.json for Firebase project tution-pro-32a33..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "314227009599",
              "project_id": "tution-pro-32a33",
              "storage_bucket": "tution-pro-32a33.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:314227009599:web:ef05d1c5560841718b308a",
                  "android_client_info": {
                    "package_name": "com.aistudio.coachmaster.wqpn"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDJXpAReUe40BZCT8IFblzxeD5MxzGuR2c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:314227009599:web:ef05d1c5560841718b308a",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDJXpAReUe40BZCT8IFblzxeD5MxzGuR2c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK was not found or is empty!"
            exit 1
          fi
          echo "APK verified successfully: $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoachMaster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK Release Assets
        id: prepare_asset
        run: |
          TMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c '[:alnum:]_.-' '-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="CoachMaster"
          fi

          VERSIONED_FILENAME="${SAFE_REPO_NAME}-build-${GITHUB_RUN_NUMBER}.apk"
          VERSIONED_PATH="$TMP_ASSET_DIR/$VERSIONED_FILENAME"
          FIXED_PATH="$TMP_ASSET_DIR/CoachMaster.apk"

          cp app/build/outputs/apk/debug/app-debug.apk "$VERSIONED_PATH"
          cp app/build/outputs/apk/debug/app-debug.apk "$FIXED_PATH"

          echo "versioned_path=$VERSIONED_PATH" >> "$GITHUB_OUTPUT"
          echo "fixed_path=$FIXED_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONED_FILE="${{ steps.prepare_asset.outputs.versioned_path }}"
          FIXED_FILE="${{ steps.prepare_asset.outputs.fixed_path }}"
          RELEASE_TAG="apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="📲 CoachMaster Android APK (Build #${GITHUB_RUN_NUMBER})"

          NOTES=$(cat <<EOF
          ## 📲 Download CoachMaster Android APK (Build #${GITHUB_RUN_NUMBER})

          Neeche **Assets** section mein **`CoachMaster.apk`** par click karke seedha apne phone mein download aur install karein!

          - **Direct APK File:** \`CoachMaster.apk\`
          - **Firebase Cloud Collections:** Connected to \`tution-pro-32a33\` (\`students\`, \`attendance\`, \`payments\`)
          - **Default Admin PIN:** \`8833\`
          - **Default Admin Password:** \`P@88337\`
          EOF
          )

          gh release create "$RELEASE_TAG" "$FIXED_FILE" "$VERSIONED_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest
