name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Firebase google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating app/google-services.json for Firebase project tution-pro-32a33..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "314227009599",
              "project_id": "tution-pro-32a33",
              "storage_bucket": "tution-pro-32a33.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:314227009599:web:ef05d1c5560841718b308a",
                  "android_client_info": {
                    "package_name": "com.aistudio.coachmaster.wqpn"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDJXpAReUe40BZCT8IFblzxeD5MxzGuR2c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:314227009599:web:ef05d1c5560841718b308a",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDJXpAReUe40BZCT8IFblzxeD5MxzGuR2c"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK was not found or is empty!"
            exit 1
          fi
          echo "APK verified successfully: $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c '[:alnum:]_.-' '-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="Tuition-pro"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="$TMP_ASSET_DIR/$ASSET_FILENAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### CoachMaster / Tuition-Pro Debug APK Build #${GITHUB_RUN_NUMBER}

          - **Firebase Sync:** Connected to \`tution-pro-32a33\` (\`tuitionAppDb/mainData\`)
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Source Commit:** ${GITHUB_SHA}
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest
