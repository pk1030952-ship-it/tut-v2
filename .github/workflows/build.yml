name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore does not exist and could not be created."
            exit 1
          fi
          echo "debug.keystore successfully verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK was not found!"
            echo "Discovered APK files under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK is an empty file!"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have the .apk extension!"; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match expected target exactly!"
            exit 1
          fi

          echo "APK verified successfully: $TARGET_APK ($(du -h "$TARGET_APK" | cut -f1))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c '[:alnum:]_.-' '-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="$TMP_ASSET_DIR/$ASSET_FILENAME"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset $DEST_PATH is missing or empty!"
            exit 1
          fi

          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Release asset $ASSET_FILE is invalid or empty."
            exit 1
          fi

          case "$ASSET_FILE" in
            *.apk) ;;
            *) echo "Error: Asset file does not have .apk extension!"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Debug APK Build #${GITHUB_RUN_NUMBER}

          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** ${GITHUB_SHA}
          - **Notice:** This APK is intended for testing and debugging only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

          echo "Release creation finished successfully."
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "=========================================================="
            echo " GitHub Release Published Successfully!"
            echo " Tag: $TAG"
            echo " Title: $TITLE"
            echo " Release URL: $RELEASE_URL"
            echo " APK Asset: $ASSET_NAME"
            echo "=========================================================="

            gh release view "$TAG" || true

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          - **Release Tag:** \`${TAG}\`
          - **Release Title:** ${TITLE}
          - **Download APK:** [Direct Release Page](${RELEASE_URL})
          - **Asset Filename:** \`${ASSET_NAME}\`

          You can download the APK directly from the **Assets** section of the release page on your phone or computer.
          Additionally, the normal GitHub Actions artifact \`app-debug-apk\` is preserved and available as a backup.
          EOF
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. The debug APK build succeeded and the artifact is safely preserved."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Note)

          - **Build Status:** Succeeded ✅
          - **Actions Artifact:** The debug APK was uploaded and preserved under the GitHub Actions artifact named \`app-debug-apk\`.
          - **Release Publishing:** Release publishing encountered an issue or was skipped, but the APK build and artifact upload completed successfully.
          EOF
          fi
